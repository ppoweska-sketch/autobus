<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autobus R3</title>
<meta name="theme-color" content="#0e1526">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="autobus.css">
<style>
  .wybor{display:flex;flex-direction:column;gap:14px;margin-top:8vh}
  .wybor a{display:flex;align-items:center;gap:16px;text-decoration:none;
    background:var(--card);border-radius:20px;padding:22px 24px;color:var(--txt)}
  .wybor img{width:56px;height:56px;border-radius:14px}
  .wybor b{font-size:30px;font-weight:800}
  .naglowek{text-align:center;font-size:26px;font-weight:800;margin-bottom:6px}
  .pod{text-align:center;color:var(--dim);font-size:15px;line-height:1.5}
</style>
</head>
<body>

<div class="naglowek">Autobus R3</div>
<div class="pod">Czyj rozkład otworzyć?</div>

<div class="wybor">
  <a href="marysia.html" data-kto="marysia">
    <img src="icon-192.png" alt=""><b>Marysia</b>
  </a>
  <a href="alicja.html" data-kto="alicja">
    <img src="icon-alicja-192.png" alt=""><b>Alicja</b>
  </a>
  <a href="janek.html" data-kto="janek">
    <img src="icon-janek-192.png" alt=""><b>Janek</b>
  </a>
</div>

<div class="pod" style="margin-top:26px">
  Wybór zostanie zapamiętany na tym telefonie.<br>
  Żeby wrócić tutaj, naciśnij <b>👥</b> u góry ekranu.
</div>

<script>
"use strict";
const KLUCZ = "autobus.ktore-dziecko";

// ?wybierz — kasuje zapamiętany wybór i pokazuje ekran ponownie
if (location.search.includes("wybierz")) {
  try { localStorage.removeItem(KLUCZ); } catch (e) {}
} else {
  // Zapamiętany wybór przenosi od razu. Dzięki temu aplikacja dodana
  // do ekranu głównego POD TYM adresem nie wymaga klikania przy każdym starcie.
  let kto = null;
  try { kto = localStorage.getItem(KLUCZ); } catch (e) {}
  if (["marysia", "alicja", "janek"].includes(kto)) location.replace(kto + ".html");
}

for (const a of document.querySelectorAll(".wybor a")) {
  a.addEventListener("click", () => {
    try { localStorage.setItem(KLUCZ, a.dataset.kto); } catch (e) {}
  });
}
</script>
</body>
</html>
